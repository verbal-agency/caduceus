[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "caduceus"
version = "0.1.0"
description = "A bounded prior-authorization exception workbench using synthetic data only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/caduceus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
